<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해례 글자블록</title>
    <style>
        /* 기본 설정 */
        body {
            font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #ffffff;
            color: #333;
        }

        /* 상단 헤더 (로고 & 타이틀) */
        header {
            padding: 30px 10px 10px;
        }
        .logo {
            width: 70px; /* 로고 크기 조정 */
            height: auto;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 1.3rem;
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* 소개글 */
        .intro {
            padding: 15px 20px 30px;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #666;
            word-break: keep-all;
        }
        .intro b {
            color: #222;
        }

        /* 한 줄에 4개씩 보여주는 그리드 설정 */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr); /* 핵심: 한 줄에 4개 배치 */
            gap: 6px; /* 이미지 사이의 좁은 간격 */
            padding: 0 10px 50px;
            max-width: 600px; /* 너무 넓어지지 않게 제한 */
            margin: 0 auto;
        }
        
        .grid img {
            width: 100%;
            aspect-ratio: 1 / 1; /* 정사각형 유지 */
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            border: 1px solid #f0f0f0;
            transition: transform 0.1s ease;
        }
        
        /* 터치했을 때 느낌이 나도록 살짝 작아짐 */
        .grid img:active {
            transform: scale(0.95);
        }

        /* GIF 팝업창(모달) */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .modal img {
            width: 85%;
            max-width: 400px;
            border-radius: 10px;
        }
        
        .modal-text {
            color: #fff;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        .close-btn {
            margin-top: 20px;
            color: #fff;
            border: 1px solid #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <img src="logo.png" alt="해례 로고" class="logo">
        <h1>해례 글자블록</h1>
    </header>

    <section class="intro">
        한글의 원리를 손끝으로 경험하는<br>
        <b>해례 글자블록</b> 조립 가이드입니다.
    </section>

    <div class="grid" id="gallery"></div>

    <div id="modal" class="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="조립 영상">
        <div class="modal-text">조립 영상을 따라 만들어보세요.</div>
        <div class="close-btn">닫기</div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        // 1번부터 20번까지 이미지를 자동으로 생성
        for (let i = 1; i <= 20; i++) {
            const img = document.createElement('img');
            // 나중에 1.jpg, 2.jpg... 파일을 올리면 연결됩니다.
            img.src = `${i}.jpg`; 
            img.alt = `블록 ${i}`;
            img.loading = "lazy"; // 성능 최적화
            img.onclick = (e) => {
                e.stopPropagation(); 
                openModal(i);
            };
            gallery.appendChild(img);
        }

        // 팝업 열기 (1.gif, 2.gif... 연결)
        function openModal(index) {
            modalImg.src = `${index}.gif`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden'; // 배경 스크롤 방지
        }

        // 팝업 닫기
        function closeModal() {
            modal.style.display = 'none';
            modalImg.src = ''; 
            document.body.style.overflow = 'auto'; // 배경 스크롤 다시 허용
        }
    </script>
</body>
</html>
