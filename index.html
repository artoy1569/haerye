<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해례 글자블록 조립 가이드</title>
    <style>
        body {
            font-family: 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
            background-color: #ffffff;
            color: #222;
            line-height: 1.6;
        }

        /* [수정] 이미지가 절대 잘리지 않도록 설정 */
        .hero {
            width: 100%;
            line-height: 0; /* 이미지 하단 미세한 간격 제거 */
        }

        .hero img {
            width: 100%;    /* 화면 너비에 맞춤 */
            height: auto;   /* 가로세로 비율 유지 (잘림 방지) */
            display: block;
        }

        /* 소개글 섹션 */
        .intro {
            padding: 40px 25px;
            max-width: 500px;
            margin: 0 auto;
            word-break: keep-all;
        }
        .intro p {
            font-size: 1.05rem;
            color: #444;
            margin-bottom: 15px;
        }
        .highlight {
            color: #a68b6a; 
            font-weight: 700;
        }
        .bold {
            font-weight: 700;
            color: #1a1a1a;
        }
        .guide-msg {
            display: inline-block;
            background: #f4f4f4;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #666;
        }

        /* 이미지 그리드 (한 줄에 4개) */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 0 15px 60px;
            max-width: 600px;
            margin: 0 auto;
        }
        .grid img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #eee;
        }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .modal img {
            width: 85%;
            max-width: 450px;
            border-radius: 12px;
        }
        .close-btn {
            margin-top: 25px;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.5);
            padding: 10px 30px;
            border-radius: 25px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- [수정] 로고/타이틀 삭제하고 이미지만 전체 노출 -->
    <section class="hero">
        <img src="top-banner.jpg" alt="해례 글자블록 메인 배너">
    </section>

    <section class="intro">
        <p>
            <span class="bold">해례 한글 글자블럭</span>은 <span class="highlight">한글 창제원리</span>를 기반으로 만든 <br>
            <span class="bold">3D 입체 글자 블록</span>으로,
        </p>
        <p>
            단어를 이루는 <span class="highlight">자음과 모음을 조립</span>하면 <br>
            <span class="bold">해당 형태가 완성</span>되는 블록 입니다.
        </p>
        <div class="guide-msg">
            👇 <span class="bold">하단의 글자</span>를 눌러 조립 방법을 확인해보세요!
        </div>
    </section>

    <div class="grid" id="gallery"></div>

    <div id="modal" class="modal" onclick="closeModal()">
        <img id="modal-img" src="" alt="조립 가이드 영상">
        <div class="close-btn">닫기</div>
    </div>

    <script>
        const gallery = document.getElementById('gallery');
        const modal = document.getElementById('modal');
        const modalImg = document.getElementById('modal-img');

        for (let i = 1; i <= 20; i++) {
            const img = document.createElement('img');
            img.src = `${i}.jpg`; 
            img.onclick = (e) => { e.stopPropagation(); openModal(i); };
            gallery.appendChild(img);
        }

        function openModal(index) {
            modalImg.src = `${index}.gif`;
            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.style.display = 'none';
            modalImg.src = ''; 
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
