<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해례 글자블록</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 헤더 -->
    <header>
        <img src="logo.png" alt="해례 로고" class="logo">
        <h1>해례 글자블록</h1>
    </header>

    <!-- 소개글 -->
    <section class="intro">
        <p>한글의 원리를 손끝으로 만나는 시간,</p>
        <p><strong>해례 글자블록</strong>은 훈민정음 해례본의 창제 원리를 직접 조립하며 체험하는 교구입니다.</p>
    </section>

    <!-- 글자블록 그리드 (20개) -->
    <div class="grid-container" id="gallery">
        <!-- 자바스크립트로 20개를 생성하거나 직접 작성 -->
        <div class="block-item" onclick="openGif('block1.gif')">
            <img src="block1_thumb.jpg" alt="글자블록 1">
        </div>
        <!-- ... 20개 반복 ... -->
    </div>

    <!-- GIF 모달 (클릭 시 보임) -->
    <div id="modal" class="modal" onclick="this.style.display='none'">
        <span class="close">&times;</span>
        <img class="modal-content" id="img01">
        <p class="caption">조립 영상 (터치 시 닫기)</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
